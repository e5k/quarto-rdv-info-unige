<style>
/* Short introductions above the live reference websites. */
.reveal .slides section.tool-introduction .tool-summary {
  font-size: 0.85em;
  line-height: 1.3;
}
.reveal .slides section.tool-introduction .tool-summary p {
  margin: 0.35em 0;
}
.reveal .slides section.tool-introduction iframe {
  display: block;
  width: 100%;
  height: 450px;
  margin: 8px 0 0;
}
.reveal .slides section.tool-introduction .tool-source {
  font-size: 0.55em;
  line-height: 1.2;
}
.reveal .slides section.tool-introduction .tool-source p {
  margin: 0.4em 0 0;
}


/* Compact spacing for the five grouped definition bullets. */
.reveal .slides section.definition-fragments > .fragment > ul {
  display: block;
  margin-bottom: 0.4em;
}
.reveal .slides section.definition-fragments li {
  margin-top: 0.12em;
  margin-bottom: 0;
}
.reveal .slides section.definition-fragments ul ul {
  font-size: 0.9em;
  line-height: 1.25;
}

.example-workflow svg {
  display: block;
  width: 100% !important;
  height: 520px !important;
  max-width: 100% !important;
  margin: 0 auto;
}
.example-workflow foreignObject {
  overflow: visible;
}

/* Mermaid computes the complete layout once; fragments only change visibility. */
#ecosystem-diagram svg {
  width: 100%;
  max-height: 68vh;
  height: auto;
}
#ecosystem-diagram foreignObject {
  overflow: visible;
}
#ecosystem-diagram:not(.ecosystem-ready) .node.step1,
#ecosystem-diagram:not(.ecosystem-ready) .node.step2,
#ecosystem-diagram:not(.ecosystem-ready) .edgePaths,
#ecosystem-diagram:not(.ecosystem-ready) .edgeLabels {
  visibility: hidden;
}
#ecosystem-diagram .fragment {
  transition: opacity 350ms ease, visibility 350ms ease;
}
@media (prefers-reduced-motion: reduce) {
  #ecosystem-diagram .fragment { transition: none; }
}
</style>
<script>
(() => {
  function boot() {
    const container = document.getElementById('ecosystem-diagram');
    if (!container) return;

    function prepare() {
      const svg = container.querySelector('svg');
      // Mermaid adds nodes before it adds the paths. Wait for the entire graph.
      if (!svg || svg.querySelectorAll('g.node').length !== 15 ||
          svg.querySelectorAll('.edgePaths path.flowchart-link').length !== 14 ||
          !window.Reveal) return false;
      if (container.classList.contains('ecosystem-ready')) return true;

      const stageOneEdges = new Set([
        'T:MD', 'C:LANG', 'R:BIB', 'MD:QMD', 'LANG:QMD', 'BIB:QMD'
      ]);

      // Keep the same coordinates at every reveal step, including on reload.
      // YAML and Pandoc occupy the document's column, never the input column.
      const positions = {
        T: [90, 140], C: [90, 260], R: [90, 380],
        MD: [320, 140], LANG: [320, 260], BIB: [320, 380],
        QMD: [590, 260], Y: [590, 80], PD: [590, 450],
        G: [320, 500], Q: [900, 260],
        W: [1140, 80], P: [1140, 200], Web: [1140, 320], S: [1140, 440]
      };
      const geometry = new Map();
      svg.querySelectorAll('g.node').forEach(node => {
        const id = node.id.match(/^flowchart-(.+)-\d+$/)?.[1];
        const position = positions[id];
        if (!position) return;
        const rect = node.querySelector('rect');
        geometry.set(id, { x: position[0], y: position[1],
          width: Number(rect.getAttribute('width')) });
        node.setAttribute('transform', `translate(${position[0]}, ${position[1]})`);
      });
      svg.setAttribute('viewBox', '0 0 1250 570');
      svg.style.maxWidth = '100%';

      function fragment(element, index) {
        element.classList.add('fragment');
        element.setAttribute('data-fragment-index', String(index));
      }

      svg.querySelectorAll('.node.step1').forEach(node => fragment(node, 0));
      svg.querySelectorAll('.node.step2').forEach(node => fragment(node, 1));

      // Mermaid versions use either L_A_B_0 or L-A-B-0 edge IDs.
      // Older versions also expose LS-A and LE-B classes.
      svg.querySelectorAll('.edgePaths path.flowchart-link').forEach(path => {
        const id = path.getAttribute('data-id') || path.id;
        const match = id.match(/^L[_-]([^_-]+)[_-]([^_-]+)(?:[_-]|$)/);
        const classes = path.getAttribute('class') || '';
        const source = match?.[1] || classes.match(/\bLS-([^\s]+)/)?.[1];
        const target = match?.[2] || classes.match(/\bLE-([^\s]+)/)?.[1];
        const from = geometry.get(source);
        const to = geometry.get(target);
        if (from && to) {
          const x1 = from.x + from.width / 2;
          const x2 = to.x - to.width / 2 - 5;
          const bend = (x1 + x2) / 2;
          path.setAttribute('d', `M ${x1},${from.y} C ${bend},${from.y} ${bend},${to.y} ${x2},${to.y}`);
        }
        fragment(path, stageOneEdges.has(`${source}:${target}`) ? 0 : 1);
      });

      const slide = container.closest('section');
      const sync = () => {
        Reveal.syncFragments(slide);
        Reveal.layout();
      };
      if (Reveal.isReady()) sync();
      else Reveal.on('ready', sync);
      container.classList.add('ecosystem-ready');
      return true;
    }

    if (prepare()) return;
    const observer = new MutationObserver(() => {
      if (prepare()) observer.disconnect();
    });
    observer.observe(container, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else boot();
})();
</script>
